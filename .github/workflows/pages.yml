name: Deploy game website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site-release.test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test release resolution and site assets
        run: node --test tests/site-release.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$SITE_URL" | grep -F 'id="apk-download"'
          curl --fail --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "${SITE_URL}releases.mjs" | grep -F 'export async function getLatestApk'
